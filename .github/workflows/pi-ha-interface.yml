name: pi-ha-interface

on:
  push:
    paths: ["pi-ha-interface/**", ".github/workflows/pi-ha-interface.yml"]
  pull_request:
    paths: ["pi-ha-interface/**", ".github/workflows/pi-ha-interface.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11" # Raspberry Pi OS Bookworm ships 3.11
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Python tests
        run: python -m unittest discover -s pi-ha-interface/tests -v
      - name: JS syntax check
        run: node --check pi-ha-interface/static/app.js
      - name: Shell syntax check
        run: |
          sh -n pi-ha-interface/install.sh
          sh -n pi-ha-interface/kiosk.sh
