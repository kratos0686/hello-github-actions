name: pi-ha-interface

on:
  push:
    paths: ["pi-ha-interface/**", ".github/workflows/pi-ha-interface.yml"]
  pull_request:
    paths: ["pi-ha-interface/**", ".github/workflows/pi-ha-interface.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11" # Raspberry Pi OS Bookworm ships 3.11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Python tests
        run: python -m unittest discover -s pi-ha-interface/tests -v
      - name: JS syntax check
        run: node --check pi-ha-interface/static/app.js
      - name: Shell syntax check
        run: |
          sh -n pi-ha-interface/install.sh
          sh -n pi-ha-interface/kiosk.sh
